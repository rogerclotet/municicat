name: municicat

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-municicat}
      POSTGRES_USER: ${POSTGRES_USER:-municicat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-municicat}
    ports:
      - "${PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - municicat-pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: production
    image: municicat-app:prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgres://${POSTGRES_USER:-municicat}:${POSTGRES_PASSWORD:-municicat}@db:5432/${POSTGRES_DB:-municicat}"
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

  seed:
    build:
      context: .
      target: production
    image: municicat-app:prod
    command: ["pnpm", "db:seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://${POSTGRES_USER:-municicat}:${POSTGRES_PASSWORD:-municicat}@db:5432/${POSTGRES_DB:-municicat}"
    init: true
    profiles: ["ops"]
    restart: "no"

volumes:
  municicat-pgdata:
